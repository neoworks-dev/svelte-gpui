[package]
name = "svelte_gpui_host"
version = "0.0.1"
edition = "2024"

[lib]
name = "svelte_gpui"
path = "src/lib.rs"

[[bin]]
name = "svelte-gpui"
path = "src/main.rs"

[build-dependencies]
serde_json = "1"

[dependencies]
gpui = "0.2.2"
rquickjs = "0.14.0"
serde_json = "1"
tiny-skia = "0.11"
smallvec = "1"
ureq = "2"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
futures = "0.3"
notify = "8"
polling = "3"
libc = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
# GPUI 0.2.2 with its line cache keeping shaped text across wrap widths (#65).
gpui = { path = "vendor/gpui" }

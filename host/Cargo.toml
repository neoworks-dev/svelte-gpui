[package]
name = "svelte_gpui_host"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "svelte-gpui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
rquickjs = "0.14.0"
serde_json = "1"
ureq = "2"
libc = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[package]
name = "rust-commands"
version = "0.1.0"
edition = "2024"
description = "A svelte-gpui app with its own Rust code: commands the UI calls, and events Rust pushes to it."

[dependencies]
svelte_gpui_host = { path = "../../host" }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"

[features]
# Set by scripts/package.mjs: runs the bundle packed into the binary instead of a --bundle file.
package = []

[patch.crates-io]
xattr = { path = "../../host/vendor/xattr" }
